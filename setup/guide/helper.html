<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HouseRunner – show me</title>
<link rel="icon" href="../../shared/brand/icon-192.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#0f141b;color:#e6edf3;font:15px/1.42 "Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:#151c26;border-bottom:1px solid #253041}
.hd .n{color:#9fb0c3;font-size:13px}
.bar{height:4px;background:#253041}.bar i{display:block;height:100%;background:#3fa9f5;transition:width .3s}
.bd{flex:1;overflow:auto;padding:10px 14px}
.where{color:#9fb0c3;font-size:13px;margin-bottom:4px}
h2{font-size:18px;line-height:1.3;margin:2px 0 10px}
.media{display:block;width:100%;border-radius:10px;border:1px solid #253041;background:#fff;margin:0 0 10px}
p{margin:0 0 8px}.mute{color:#9fb0c3;font-size:13px}
.done{background:#123322;border:1px solid #2b7a4b;color:#c8f2d6;border-radius:10px;padding:10px 12px;font-weight:600}
.ft{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;border-top:1px solid #253041;background:#151c26}
button{font:inherit;font-weight:700;border-radius:10px;padding:8px 13px;cursor:pointer;border:1px solid #33465c}
.gh{background:none;color:#cbd6e2}.go{background:#2563eb;color:#fff;border-color:#2563eb}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<script>
/* "Show me": a small window beside setup with a short clip or picture of each click in "HouseRunner makes it for you".
 * A window of its own (not a floating one), because the setup tab goes to Google and back during the approval and a floating
 * window would close with it. It follows along by itself – auto.js writes where setup is up to (localStorage "hrinstall.stage") –
 * and "Done – next" moves it on where it can't tell (the clicks in Google's own windows).
 * Where a picture shows Google's screens, the account shown is marked "your own Google email": the person sees theirs. */
(function () {
    var V = '../../shared/brand/steps/', REV = '346';
    var SETUP = '🏠 In the <b>HouseRunner setup</b> tab', GWIN = '🔐 In <b>Google’s window</b>', GTAB = '🔐 <b>Google</b>, in the HouseRunner setup tab';
    // [stage, where, what to click, help, media (one, or several shown in turn)]
    var STEPS = [
        ['start', SETUP, 'Click <b>Sign in with Google</b>', 'Use the Google account you want the dashboard in – ideally the one with your family calendar.', 'h-signin.mp4'],
        ['signin', GWIN, 'Choose <b>your</b> Google account', 'Google opens a small window. Your own name and email are shown where the picture says <i>your name</i> and <i>your own Google email</i>.', 'h-choose.png'],
        ['signin', GWIN, '“Google hasn’t verified this app”: click <b>Continue</b>', 'That’s expected – HouseRunner is new. Click the blue word <b>Continue</b> on the left, <b>not</b> “Back to safety”. <span class="mute">(If it shows <b>Advanced</b> instead, click that, then <b>Go to HouseRunner Installer (unsafe)</b>.)</span>', 'h-testing.png'],
        ['signin', GWIN, 'Tick <b>Select all</b>, scroll down, click <b>Continue</b>', 'The yellow box saying the app isn’t verified yet is expected too.', ['h-consent.png', 'p-selectall.png']],
        ['api', SETUP, 'Only if asked: switch on <b>Google Apps Script API</b>', 'Click <b>Open my Apps Script settings</b>. In that new tab: click <b>Google Apps Script API</b>, switch it <b>On</b>, then close that tab – setup carries on by itself. <span class="mute">(A simplified picture.)</span>', 'i-apiswitch.png'],
        ['making', SETUP, '⏳ Wait – HouseRunner is making your Sheet', 'About 30 seconds. The list ticks itself off – don’t close the tab.', 'h-making.mp4'],
        ['approve', SETUP, 'Click <b>Approve HouseRunner App</b>', 'Now your own Sheet asks for its permissions. This tab goes to Google, then comes back.', 'i-approve.png'],
        ['google2', GTAB, 'Click <b>REVIEW PERMISSIONS</b>', 'Google says “HouseRunner App (Unverified) needs your permission” – that’s your own private copy.', 'h-review.mp4'],
        ['google2', GWIN, 'Choose <b>your</b> Google account', 'The same account as before. If Google then says <b>“Google hasn’t verified this app”</b>, click <b>Continue</b> on the left.', ['h-choose.png', 'h-testing.png']],
        ['google2', GWIN, 'Tick <b>Select all</b>, scroll down, click <b>Continue</b>', 'Every permission is needed – setup explains each one. Google’s window then closes.', ['h-consent.png', 'p-selectall.png']],
        ['google2', GTAB, 'Wait for Google', 'It shows “Waiting for authorization…” for a few seconds. <b>Stuck there?</b> Press <b>F5</b> to reload.', 'h-waiting.png'],
        ['google2', GTAB, 'Click <b>▶ Back to HouseRunner setup</b>', 'Google shows <b>✅ Approved – your Sheet is switched on</b>.', 'h-approved.mp4'],
        ['finish', SETUP, 'Click <b>Finish publishing</b>', 'One last click so your screen and phones can reach your Sheet. A Google window may flash up and close by itself.', 'h-finish.mp4'],
        ['done', SETUP, '✅ That’s the Google part done', '<div class="done">Setup connects to your new Sheet and carries on by itself. This window closes in a moment.</div>', 'i-done.png']
    ];
    var FIRST = {}; STEPS.forEach(function (s, k) { if (!(s[0] in FIRST)) FIRST[s[0]] = k; });
    FIRST.checking = FIRST.google2 + 3;      // back from Google, checking the Sheet: the last of Google's steps
    var i = 0, cyc = 0, closeT = 0;
    function stageNow() { try { return localStorage.getItem('hrinstall.stage') || 'start'; } catch (e) { return 'start'; } }
    function follow() {
        var st = stageNow(), k = FIRST[st];
        if (k == null) return;
        if (k > i || st === 'api' || st === 'start') go(k);      // moves on by itself (and back only for the Apps Script switch)
        if (st === 'done') { clearTimeout(closeT); closeT = setTimeout(function () { window.close(); }, 12000); }
    }
    function media(m) {
        if (/\.mp4$/.test(m)) return '<video class="media" src="' + V + m + '?v=' + REV + '" autoplay muted loop playsinline></video>';
        return '<img class="media" alt="" src="' + V + m + '?v=' + REV + '">';
    }
    function go(k) {
        i = Math.max(0, Math.min(STEPS.length - 1, k));
        var s = STEPS[i], last = i === STEPS.length - 1, list = [].concat(s[4]);
        document.body.innerHTML =
            '<div class="hd"><b>Show me</b><span class="n">' + (i + 1) + ' of ' + STEPS.length + '</span></div>' +
            '<div class="bar"><i style="width:' + Math.round((i + 1) / STEPS.length * 100) + '%"></i></div>' +
            '<div class="bd"><div class="where">' + s[1] + '</div><h2>' + s[2] + '</h2><div id="m">' + media(list[0]) + '</div><p>' + s[3] + '</p>' +
            '<p class="mute">This window moves on by itself where it can tell.</p></div>' +
            '<div class="ft"><button class="gh" id="bk"' + (i ? '' : ' disabled') + '>← Back</button>' +
            (last ? '<button class="go" id="cl">✕ Close</button>' : '<button class="go" id="nx">Done – next →</button>') + '</div>';
        var on = function (id, f) { var b = document.getElementById(id); if (b) b.onclick = f; };
        on('bk', function () { go(i - 1); }); on('nx', function () { go(i + 1); }); on('cl', function () { window.close(); });
        document.title = (i + 1) + ' – Show me – HouseRunner';
        clearInterval(cyc);
        if (list.length > 1) { var n = 0; cyc = setInterval(function () { n = (n + 1) % list.length; var m = document.getElementById('m'); if (m) m.innerHTML = media(list[n]); }, 2800); }
    }
    window.addEventListener('storage', function (e) { if (e.key === 'hrinstall.stage') follow(); });
    window.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });
    go(FIRST[stageNow()] || 0);
    follow();
})();
</script>
</body>
</html>
