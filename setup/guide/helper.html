<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HouseRunner – show me</title>
<link rel="icon" href="../../shared/brand/icon-192.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#0f141b;color:#e6edf3;font:15px/1.42 "Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:#151c26;border-bottom:1px solid #253041}
.hd .n{color:#9fb0c3;font-size:13px}
.bar{height:4px;background:#253041}.bar i{display:block;height:100%;background:#3fa9f5;transition:width .3s}
.bd{flex:1;overflow:auto;padding:10px 14px}
.where{color:#9fb0c3;font-size:13px;margin-bottom:4px}
h2{font-size:18px;line-height:1.3;margin:2px 0 10px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 7px;margin-right:6px;border-radius:15px;background:#2563eb;color:#fff;font-size:15px;font-weight:800;vertical-align:2px}
.again{display:block;margin:-4px 0 12px;padding:8px 14px;border-radius:10px;border:1px solid #2b3647;background:transparent;color:#e6edf3;font:600 15px system-ui,sans-serif;cursor:pointer}
.media{display:block;width:100%;max-height:56vh;object-fit:contain;border-radius:10px;border:1px solid #253041;background:#fff;margin:0 0 10px}
p{margin:0 0 8px}.mute{color:#9fb0c3;font-size:13px}
.done{background:#123322;border:1px solid #2b7a4b;color:#c8f2d6;border-radius:10px;padding:10px 12px;font-weight:600}
.ft{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;border-top:1px solid #253041;background:#151c26}
button{font:inherit;font-weight:700;border-radius:10px;padding:8px 13px;cursor:pointer;border:1px solid #33465c}
.gh{background:none;color:#cbd6e2}.go{background:#2563eb;color:#fff;border-color:#2563eb}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<script>
/* The step-by-step guide on the phone: setup shows a QR code beside each step; this page gives a short clip or picture and the
 * words for each click in "HouseRunner makes it for you", to follow alongside the computer. ?set= picks the guide, ?at= where it starts.
 * Where a picture shows Google's screens, the account shown is marked "your own Google email": the person sees theirs. */
(function () {
    var V = '../../shared/brand/steps/', REV = '377';
    var SETUP = '🏠 In the <b>HouseRunner setup</b> tab', GWIN = '🔐 In <b>Google’s window</b>', GTAB = '🔐 <b>Google</b>, in the HouseRunner setup tab';
    // The whole of "Make your Google Sheet", numbered as on the page: 1–5 for its steps, A, B, C… for the Google screens within one.
    // [stage, where, what to click, help, media, number]
    var STEPS = [
        ['start', SETUP, 'Click <b>Sign in to Google</b>', 'Use the Google account you want HouseRunner in – ideally the one with your family calendar.', 'i-gsign.png', '1'],
        ['google', GWIN, 'Choose your account', 'Click <b>your</b> account – your own name and email show where the clip says <i>your name</i>. Not signed in on this computer yet? Google asks for your email and password first. Not listed? <b>Use another account</b>.', 'v-s-choose.mp4', '1A'],
        ['google', GWIN, 'Sign in to HouseRunner: click <b>Continue</b>', 'Google calls it houserunner.app. Click <b>Continue</b> on the right.', 'v-s-signinto.mp4', '1B'],
        ['perms', SETUP, 'Click <b>Approve Installer App permissions</b>', 'A green ✅ shows which Google account you’re signed in to.', 'i-perms.png', '2'],
        ['signin', GWIN, 'Continue past the “unverified” screen', 'Expected – HouseRunner is new. Click <b>Continue</b> on the <b>left</b>, not “Back to safety”.', 'v-p-testing.mp4', '2A'],
        ['signin', GWIN, 'Agree the permissions it needs', 'Tick <b>Select all</b>, scroll to the bottom and click <b>Continue</b>. Every permission is needed – setup’s “see why” explains each one.', 'v-p-consent.mp4', '2B'],
        ['making', SETUP, '⏳ Wait – HouseRunner makes your Sheet by itself', 'About 30 seconds. Beside the step it shows where it’s up to. Don’t close the tab.', 'i-making.png', '3'],
        ['api', '⚙️ In the <b>Apps Script settings</b> tab', 'Only if setup asks: switch on <b>Google Apps Script API</b>', 'Click <b>Open my Apps Script settings</b> in setup. In the new tab click <b>Google Apps Script API</b>, then the switch at the <b>far right</b> so it turns <b>On</b>. <b style="color:#fca5a5">Then close that tab</b> and go back to setup – it carries on by itself.', 'v-switch.mp4', '3'],
        ['approve', SETUP, 'Click <b>Sign into the Main App</b>', 'Now your own Sheet – the Main App – asks for its permissions. This tab goes to Google, then comes back.', 'i-approve.png', '4'],
        ['google2', GTAB, 'Review permissions', 'Google says “HouseRunner App (Unverified) needs your permission” – your own private copy. Click the blue <b>REVIEW PERMISSIONS</b>.', 'h-review.mp4', '4A'],
        ['google2', GTAB, '<b>Advanced</b>, then <b>Go to HouseRunner App (unsafe)</b>', 'Expected – it’s your own private copy. Click <b>Advanced</b> (bottom left), then the link <b>Go to HouseRunner App (unsafe)</b>. If Google asks which account, choose yours.', 'v-a-unsafe.mp4', '4B'],
        ['google2', GTAB, 'Approve the permissions your Sheet needs', 'A yellow box says the app isn’t verified yet – expected. Tick <b>Select all</b>, scroll to the bottom, click <b>Continue</b>.', 'v-a-consent.mp4', '4C'],
        ['google2', GTAB, 'Wait – it can take a minute or two – then back to setup', 'Google shows “Waiting for authorization…”. <b>Just wait</b> – only if nothing happens after 2 minutes, press <b>F5</b>. Then it shows <b>✅ Approved</b>: click <b>▶ Back to HouseRunner setup</b> if it doesn’t go back by itself.', 'v-a-wait.mp4', '4D'],
        ['finish', SETUP, 'Click <b>Finish publishing</b>', 'One last click so your screen and phones can reach your Sheet. A Google window may flash up and close by itself.', 'h-finish.mp4', '5'],
        ['done', SETUP, '✅ That’s your Google Sheet made', '<div class="done">Setup on your computer connects to your new Sheet and carries on by itself – follow the instructions there.</div>', 'i-done.png', '✓']
    ];
    var SET = (/[?&]set=(\w+)/.exec(location.search) || [])[1] || '';
    var FIRST = {}; STEPS.forEach(function (s, k) { if (!(s[0] in FIRST)) FIRST[s[0]] = k; });
    FIRST.checking = FIRST.finish;
    // Older QR codes: the Installer's permissions, or the Main App's approval
    if (SET === 'perms') FIRST.start = FIRST.perms;
    if (SET === 'approve') FIRST.start = FIRST.approve;
    var i = 0, cyc = 0, closeT = 0;
    function stageNow() { try { return localStorage.getItem('hrinstall.stage') || 'start'; } catch (e) { return 'start'; } }
    function follow() {
        var st = stageNow(), k = FIRST[st];
        if (k == null) return;
        if (k > i || st === 'api' || st === 'start') go(k);      // moves on by itself (and back only for the Apps Script switch)
    }
    function media(m) {
        if (/\.mp4$/.test(m)) return '<video class="media" src="' + V + m + '?v=' + REV + '" autoplay muted playsinline></video>';
        return '<img class="media" alt="" src="' + V + m + '?v=' + REV + '">';
    }
    function go(k) {
        i = Math.max(0, Math.min(STEPS.length - 1, k));
        var s = STEPS[i], last = i === STEPS.length - 1, list = [].concat(s[4]);
        document.body.innerHTML =
            '<div class="hd"><b>' + 'Make your Google Sheet – step by step' + '</b><span class="n">' + (i + 1) + ' of ' + STEPS.length + '</span></div>' +
            '<div class="bar"><i style="width:' + Math.round((i + 1) / STEPS.length * 100) + '%"></i></div>' +
            '<div class="bd"><div class="where">' + s[1] + '</div><h2><span class="num">' + s[5] + '</span> ' + s[2] + '</h2><div id="m">' + media(list[0]) + '</div><p>' + s[3] + '</p>' +
            '<p class="mute">Tap <b>Next</b> as you go.</p></div>' +
            '<div class="ft"><button class="gh" id="bk"' + (i ? '' : ' disabled') + '>← Back</button>' +
            (last ? '<button class="gh" id="st">↺ From the start</button>' : '<button class="go" id="nx">Next →</button>') + '</div>';
        var on = function (id, f) { var b = document.getElementById(id); if (b) b.onclick = f; };
        on('bk', function () { go(i - 1); }); on('nx', function () { go(i + 1); }); on('st', function () { go(0); });
        document.title = (i + 1) + ' – Step by step – HouseRunner';
        clearInterval(cyc);
        if (list.length > 1) { var n = 0; cyc = setInterval(function () { n = (n + 1) % list.length; var m = document.getElementById('m'); if (m) m.innerHTML = media(list[n]); }, 2800); }
    }
    window.addEventListener('storage', function (e) { if (e.key === 'hrinstall.stage') follow(); });
    window.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });
    var AT = (/[?&]at=(\w+)/.exec(location.search) || [])[1];
    go(AT && AT in FIRST ? FIRST[AT] : FIRST[stageNow()] || 0);
    follow();
})();

/* Clips play once, then offer ↻ Play again */
document.addEventListener('ended', function (e) {
    var v = e.target; if (!v || v.tagName !== 'VIDEO' || v.nextSibling && v.nextSibling.className === 'again') return;
    var b = document.createElement('button'); b.className = 'again'; b.type = 'button'; b.textContent = '↻ Play again';
    b.onclick = function () { b.remove(); v.currentTime = 0; v.play(); };
    v.parentNode.insertBefore(b, v.nextSibling);
}, true);
</script>
</body>
</html>
