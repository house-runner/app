<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HouseRunner – step window</title>
<link rel="icon" href="../../shared/brand/icon-192.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#0f141b;color:#e6edf3;font:15px/1.42 "Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#151c26;border-bottom:1px solid #253041}
.hd .n{color:#9fb0c3;font-size:13px}
.bar{height:4px;background:#253041}.bar i{display:block;height:100%;background:#3fa9f5;transition:width .3s}
.bd{flex:1;overflow:auto;padding:12px 16px}
.where{display:flex;gap:8px;align-items:center;color:#9fb0c3;font-size:13px;margin-bottom:6px}
.where img{width:18px;height:18px}
h2{font-size:19px;line-height:1.3;margin:4px 0 10px}
.media{display:block;width:100%;border-radius:10px;border:1px solid #253041;background:#fff;margin:0 0 10px}
p{margin:0 0 10px}.mute{color:#9fb0c3}
.wait{display:block;background:#2a2410;border:1px solid #7a5d12;color:#ffe2a8;border-radius:8px;padding:6px 10px;margin:0 0 8px}
.done{background:#123322;border:1px solid #2b7a4b;color:#c8f2d6;border-radius:10px;padding:10px 12px;font-weight:600}
.auto{font-size:12px;color:#7f93a8;margin-top:6px}
.ft{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid #253041;background:#151c26}
button{font:inherit;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid #33465c}
.gh{background:none;color:#cbd6e2}.go{background:#2563eb;color:#fff;border-color:#2563eb}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<script>
/* The step window for "Set it up for me". A window of its own (not a floating one): the setup tab goes to Google and back
 * during approval, and a floating window would close with it. It follows along by itself – auto.js writes where it is up
 * to (localStorage "hrinstall.stage") – and "Done – next step" moves it on by hand where it can't tell. */
(function () {
    var V = '../../shared/brand/steps/', REV = '332';
    var HR = '<img src="' + V + 't-hr.png" alt="">';
    var WHERE = { setup: [HR, 'In the <b>HouseRunner setup</b> tab'], popup: ['🔐', 'In <b>Google’s window</b>'], settings: ['⚙️', 'In the <b>Apps Script settings</b> tab'], google: ['🔐', 'Google, in the HouseRunner setup tab'] };
    // [stage it belongs to, where, what to click, help, picture]
    var STEPS = [
        ['start', 'setup', 'Click <b>Sign in with Google</b>', 'Use the Google account you want the dashboard in – ideally the one with your family calendar.', 'i-signin.png'],
        ['signin', 'popup', 'Choose your account, then click <b>Advanced</b> → <b>Go to HouseRunner Installer (unsafe)</b>', 'Google says it hasn’t verified the app yet – that’s expected. The installer only makes <b>one new Sheet</b> and its script; it can’t see your other files. <span class="mute">No warning? Skip to the next step.</span>', 'p-advanced.png'],
        ['signin', 'popup', 'Tick <b>Select all</b>, then click <b>Continue</b>', 'All three are needed: make one Sheet, make its script, and publish it. Google’s window then closes.', 'p-selectall.png'],
        ['api', 'settings', 'Only if asked: switch on <b>Google Apps Script API</b>', 'HouseRunner shows a link to your Apps Script settings. Click <b>Google Apps Script API</b>, switch it <b>On</b>, close that tab, then click <b>Try again</b> in HouseRunner setup. <span class="mute">Not asked? Skip this step.</span>', 'i-apiswitch.png'],
        ['making', 'setup', '⏳ Wait – HouseRunner is making your Sheet', '<span class="wait">⏳ About 30 seconds. The list ticks itself off – don’t close the tab.</span>', 'i-making.png'],
        ['approve', 'setup', 'Click <b>Approve HouseRunner App</b>', 'Now Google asks you to approve what your HouseRunner does: your calendar, sending your setup emails and so on. The setup page explains each one.', 'i-approve.png'],
        ['google2', 'popup', 'Choose your account, then click <b>Advanced</b> → <b>Go to HouseRunner App (unsafe)</b>', 'Google says it hasn’t verified this app: that’s normal – it’s your own private copy, and the “developer” it names is you.', 'p-advanced.png'],
        ['google2', 'popup', 'Tick <b>Select all</b>, then click <b>Continue</b>', 'Every permission is needed. Google’s window then closes.', 'p-selectall.png'],
        ['google2', 'google', 'Click <b>▶ Back to HouseRunner setup</b>', 'Google shows <b>✅ Approved – your Sheet is switched on</b>. Click the blue button on it. <span class="mute">Stuck on “Waiting for authorization…”? Press <b>F5</b> to reload.</span>', 'i-waiting.png'],
        ['done', 'setup', '✅ That’s the Google part done', '<div class="done">HouseRunner checked your Sheet answers and carries on in the setup tab. This window closes by itself.</div>', 'i-done.png']
    ];
    var FIRST = {}; STEPS.forEach(function (s, k) { if (!(s[0] in FIRST)) FIRST[s[0]] = k; });
    FIRST.checking = FIRST.done - 1;
    var i = 0, closeT = 0;
    function stageNow() { try { return localStorage.getItem('hrinstall.stage') || 'start'; } catch (e) { return 'start'; } }
    function follow() {
        var st = stageNow(), k = FIRST[st];
        if (k == null) return;
        // Moves on by itself, and back only for the Apps Script switch (asked for after signing in)
        if (k > i || st === 'api' || st === 'start') go(k);
        if (st === 'done') { clearTimeout(closeT); closeT = setTimeout(function () { window.close(); }, 15000); }
    }
    function go(k) {
        i = Math.max(0, Math.min(STEPS.length - 1, k));
        var s = STEPS[i], w = WHERE[s[1]], last = i === STEPS.length - 1;
        document.body.innerHTML =
            '<div class="hd"><b>HouseRunner setup</b><span class="n">Step ' + (i + 1) + ' of ' + STEPS.length + '</span></div>' +
            '<div class="bar"><i style="width:' + Math.round((i + 1) / STEPS.length * 100) + '%"></i></div>' +
            '<div class="bd"><div class="where">' + w[0] + '<div>' + w[1] + '</div></div><h2>' + s[2] + '</h2>' +
            '<img class="media" alt="" src="' + V + s[4] + '?v=' + REV + '"><p>' + s[3] + '</p>' +
            '<div class="auto">This window moves on by itself where it can tell.</div></div>' +
            '<div class="ft"><button class="gh" id="bk"' + (i ? '' : ' disabled') + '>← Back</button>' +
            (last ? '<button class="go" id="cl">✕ Close</button>' : '<button class="go" id="nx">Done – next step →</button>') + '</div>';
        var on = function (id, f) { var b = document.getElementById(id); if (b) b.onclick = f; };
        on('bk', function () { go(i - 1); }); on('nx', function () { go(i + 1); }); on('cl', function () { window.close(); });
        document.title = 'Step ' + (i + 1) + ' – HouseRunner';
    }
    window.addEventListener('storage', function (e) { if (e.key === 'hrinstall.stage') follow(); });
    window.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });
    go(FIRST[stageNow()] || 0);
    follow();
})();
</script>
</body>
</html>
